name: Repro CLI hang (diagnostic only)

on:
  # workflow_dispatch can't be invoked on a non-default branch until the workflow file
  # exists on the default branch, so this diagnostic-only workflow instead triggers on
  # push, but only for this investigation's own branch -- it never runs on main or on
  # any push elsewhere.
  push:
    branches: [work/v1.5.3-cli-hang-diagnosis]

env:
  ITERATIONS: "200"
  REPRO_COMMAND: "memory-protocol --json"

permissions:
  contents: read

jobs:
  repro:
    name: memory-protocol loop (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Loop without the candidate fix (baseline)
        shell: bash
        run: |
          set +e
          n=${{ env.ITERATIONS }}
          timeouts=0
          complete_but_killed=0
          for i in $(seq 1 "$n"); do
            dir=$(mktemp -d)
            timeout 5 env FORGE614_HOME="$dir/.forge614" bun src/cli.ts ${{ env.REPRO_COMMAND }} >"$dir/out.json" 2>"$dir/err.txt"
            ec=$?
            if [ "$ec" -eq 124 ]; then
              timeouts=$((timeouts+1))
              if jq empty "$dir/out.json" >/dev/null 2>&1; then complete_but_killed=$((complete_but_killed+1)); fi
              echo "  [baseline #$i] TIMED OUT; stdout bytes=$(wc -c <"$dir/out.json"); valid complete JSON already present: $(jq empty "$dir/out.json" >/dev/null 2>&1 && echo yes || echo no)"
            fi
            rm -rf "$dir"
          done
          echo "BASELINE: $timeouts/$n timed out; of those, $complete_but_killed already had complete valid JSON in stdout when killed."
      - name: Loop with the candidate fix (FORGE614_EXPERIMENT_EXIT=1)
        shell: bash
        env:
          FORGE614_EXPERIMENT_EXIT: "1"
        run: |
          set +e
          n=${{ env.ITERATIONS }}
          timeouts=0
          complete_but_killed=0
          for i in $(seq 1 "$n"); do
            dir=$(mktemp -d)
            timeout 5 env FORGE614_HOME="$dir/.forge614" FORGE614_EXPERIMENT_EXIT=1 bun src/cli.ts ${{ env.REPRO_COMMAND }} >"$dir/out.json" 2>"$dir/err.txt"
            ec=$?
            if [ "$ec" -eq 124 ]; then
              timeouts=$((timeouts+1))
              if jq empty "$dir/out.json" >/dev/null 2>&1; then complete_but_killed=$((complete_but_killed+1)); fi
              echo "  [fixed #$i] TIMED OUT; stdout bytes=$(wc -c <"$dir/out.json"); valid complete JSON already present: $(jq empty "$dir/out.json" >/dev/null 2>&1 && echo yes || echo no)"
            fi
            rm -rf "$dir"
          done
          echo "WITH FIX: $timeouts/$n timed out; of those, $complete_but_killed already had complete valid JSON in stdout when killed."
      - name: "Experiment 5a: inherited stdin that never sends EOF (baseline)"
        shell: bash
        run: |
          set +e
          n=${{ env.ITERATIONS }}
          timeouts=0
          for i in $(seq 1 "$n"); do
            dir=$(mktemp -d)
            sleep 600 | timeout 5 env FORGE614_HOME="$dir/.forge614" bun src/cli.ts ${{ env.REPRO_COMMAND }} >"$dir/out.json" 2>"$dir/err.txt"
            ec=$?
            if [ "$ec" -eq 124 ]; then
              timeouts=$((timeouts+1))
              echo "  [5a-baseline #$i] TIMED OUT; stdout bytes=$(wc -c <"$dir/out.json")"
            fi
            rm -rf "$dir"
          done
          echo "5a BASELINE (stdin inherited from a never-closing pipe): $timeouts/$n timed out."
      - name: "Experiment 5a: same, with stdin explicitly closed (candidate fix)"
        shell: bash
        run: |
          set +e
          n=${{ env.ITERATIONS }}
          timeouts=0
          for i in $(seq 1 "$n"); do
            dir=$(mktemp -d)
            sleep 600 | timeout 5 env FORGE614_HOME="$dir/.forge614" bun src/cli.ts ${{ env.REPRO_COMMAND }} </dev/null >"$dir/out.json" 2>"$dir/err.txt"
            ec=$?
            if [ "$ec" -eq 124 ]; then
              timeouts=$((timeouts+1))
              echo "  [5a-fixed #$i] TIMED OUT; stdout bytes=$(wc -c <"$dir/out.json")"
            fi
            rm -rf "$dir"
          done
          echo "5a WITH FIX (stdin explicitly redirected from /dev/null, same as Bun.spawn's stdin:\"ignore\"): $timeouts/$n timed out."
      - name: "Experiment 5b: a concurrent writer holds BEGIN IMMEDIATE on the same database"
        shell: bash
        run: |
          set +e
          n=${{ env.ITERATIONS }}
          timeouts=0
          lockdir=$(mktemp -d)
          export FORGE614_HOME="$lockdir/.forge614"
          bun src/cli.ts init --json >/dev/null 2>&1
          validdir=$(mktemp -d)
          bun -e '
            import { Database } from "bun:sqlite";
            const db = new Database(process.env.FORGE614_HOME + "/engram/engram.db");
            db.exec("BEGIN IMMEDIATE;");
            console.error("HOLDER: write lock acquired, never committing");
            setInterval(() => {}, 3600_000);
          ' &
          holder_pid=$!
          sleep 1
          for i in $(seq 1 "$n"); do
            timeout 5 env FORGE614_HOME="$lockdir/.forge614" bun src/cli.ts startup-context --directory "$validdir" --json >"$lockdir/out-$i.json" 2>"$lockdir/err-$i.txt"
            ec=$?
            if [ "$ec" -eq 124 ]; then
              timeouts=$((timeouts+1))
              echo "  [5b #$i] TIMED OUT; stderr=$(cat "$lockdir/err-$i.txt")"
            fi
            rm -f "$lockdir/out-$i.json" "$lockdir/err-$i.txt"
          done
          kill "$holder_pid" 2>/dev/null
          echo "5b (concurrent BEGIN IMMEDIATE held on the same db, reading via startup-context): $timeouts/$n timed out."
