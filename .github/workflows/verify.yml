name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  # Clúster de PostgreSQL desechable obligatorio en Windows mediante fixture nativo (T6).
  windows:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Discover and configure PostgreSQL binaries for disposable test fixture
        shell: pwsh
        run: |
          $pgBin = $env:PGBIN
          if (-not $pgBin -or -not (Test-Path (Join-Path $pgBin "initdb.exe"))) {
            # Búsqueda alternativa bajo C:\Program Files\PostgreSQL si PGBIN no estuviera publicado directamente
            $candidates = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory -ErrorAction SilentlyContinue |
              Sort-Object { [int]($_.Name -replace '\D') } -Descending |
              ForEach-Object { Join-Path $_.FullName "bin" }
            $pgBin = $candidates | Where-Object { (Test-Path (Join-Path $_ "initdb.exe")) -and (Test-Path (Join-Path $_ "pg_ctl.exe")) } | Select-Object -First 1
          }

          if (-not $pgBin) {
            Write-Error "CRITICAL: Could not find PostgreSQL installation directory on Windows runner."
            exit 1
          }

          $initdbPath = Join-Path $pgBin "initdb.exe"
          $pgctlPath = Join-Path $pgBin "pg_ctl.exe"
          $postgresPath = Join-Path $pgBin "postgres.exe"

          if (-not (Test-Path $initdbPath) -or -not (Test-Path $pgctlPath) -or -not (Test-Path $postgresPath)) {
            Write-Error "CRITICAL: Required PostgreSQL binaries ($initdbPath, $pgctlPath, $postgresPath) not found."
            exit 1
          }

          $rawVersion = & $initdbPath --version
          if ($LASTEXITCODE -ne 0 -or $rawVersion -notmatch 'PostgreSQL\) (17|18)(\.|\s|$)') {
            Write-Error "CRITICAL: Expected PostgreSQL 17 or 18, found: $rawVersion"
            exit 1
          }
          Write-Host "Discovered PostgreSQL binaries at: $pgBin ($rawVersion)"

          "FORGE614_TEST_POSTGRES_BIN=$pgBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FORGE614_REQUIRE_TEST_POSTGRES=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Syntax-check verification scripts
        run: |
          node --check scripts/verify-windows-postgres.mjs
          node --check scripts/diagnose-postgres-sync.mjs
          node --check scripts/fixtures/postgres-sync-cli.mjs
          node --check scripts/verify-windows-test-files.mjs
      - name: Verify disposable PostgreSQL preflight
        run: bun scripts/verify-windows-postgres.mjs
      - name: Diagnose postgres-sync e2e test with external timeout
        run: bun scripts/diagnose-postgres-sync.mjs
      - name: Run all Bun test files in isolated processes
        run: node scripts/verify-windows-test-files.mjs
  windows-self-update:
    name: Windows self-update integration
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Disable Windows Defender real-time scanning for this job
        shell: pwsh
        continue-on-error: true
        run: |
          # Best-effort: la compilación y ejecución de un ejecutable no firmado que descarga
          # binarios y lanza procesos hijos sufre escrutinio intensivo de Defender en Windows CI.
          # Solo para este job de CI, nunca en instalaciones de usuario.
          Set-MpPreference -DisableRealtimeMonitoring $true
      - name: Syntax-check verification scripts
        run: |
          node --check scripts/fixtures/windows-self-update-entry.mjs
          node --check scripts/verify-windows-self-update.mjs
      - name: Verify native self-update on Windows
        run: bun scripts/verify-windows-self-update.mjs
      - name: Print self-update diagnostics and clean fixtures
        if: always()
        shell: pwsh
        run: |
          $diag = "${{ runner.temp }}\forge614-engram-self-update-diag.log"
          Write-Host "--- diagnostic log ($diag) ---"
          if (Test-Path $diag) { Get-Content $diag -Tail 100 } else { Write-Host "No diagnostic log found." }

          $engramHome = "${{ runner.temp }}\forge614-engram-self-update-home\engram"

          $helperLogs = Get-ChildItem -Path $engramHome -Filter "swap-helper-*.log" -Exclude "*.spawn.log" -ErrorAction SilentlyContinue
          if ($helperLogs) {
            foreach ($log in $helperLogs) {
              Write-Host "--- helper log ($($log.FullName)) ---"
              Get-Content $log.FullName -Tail 100
            }
          } else {
            Write-Host "No swap-helper-*.log files found under $engramHome"
          }

          $spawnLogs = Get-ChildItem -Path $engramHome -Filter "swap-helper-*.spawn.log" -ErrorAction SilentlyContinue
          if ($spawnLogs) {
            foreach ($log in $spawnLogs) {
              Write-Host "--- wmi spawn log ($($log.FullName)) ---"
              Get-Content $log.FullName -Tail 100
            }
          } else {
            Write-Host "No swap-helper-*.spawn.log files found under $engramHome"
          }

          Write-Host "--- cleaning fixtures ---"
          Remove-Item -Path "${{ runner.temp }}\forge614-engram-self-update-home" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "${{ runner.temp }}\forge614-engram-self-update-asset" -Recurse -Force -ErrorAction SilentlyContinue
  windows-uninstall:
    name: Windows uninstall integration
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Disable Windows Defender real-time scanning for this job
        shell: pwsh
        continue-on-error: true
        run: |
          # Best-effort: la compilación y ejecución de un ejecutable no firmado que manipula
          # carpetas y lanza procesos hijos sufre escrutinio intensivo de Defender en Windows CI.
          # Solo para este job de CI, nunca en instalaciones de usuario.
          Set-MpPreference -DisableRealtimeMonitoring $true
      - name: Syntax-check verification scripts
        run: |
          node --check scripts/fixtures/windows-uninstall-entry.mjs
          node --check scripts/verify-windows-uninstall.mjs
      - name: Verify native uninstall on Windows
        run: bun scripts/verify-windows-uninstall.mjs
      - name: Print uninstall diagnostics and clean fixtures
        if: always()
        shell: pwsh
        run: |
          $diag = "${{ runner.temp }}\forge614-engram-uninstall-diag.log"
          Write-Host "--- diagnostic log ($diag) ---"
          if (Test-Path $diag) { Get-Content $diag -Tail 100 } else { Write-Host "No diagnostic log found." }

          $tempDir = "${{ runner.temp }}\forge614-engram-uninstall-temp"
          if (Test-Path $tempDir) {
            $helperLogs = Get-ChildItem -Path $tempDir -Filter "forge614-engram-uninstall-*.log" -Exclude "*.spawn.log" -ErrorAction SilentlyContinue
            if ($helperLogs) {
              foreach ($log in $helperLogs) {
                Write-Host "--- helper log ($($log.FullName)) ---"
                Get-Content $log.FullName -Tail 100
              }
            } else {
              Write-Host "No uninstall helper log files found under $tempDir"
            }

            $spawnLogs = Get-ChildItem -Path $tempDir -Filter "forge614-engram-uninstall-*.spawn.log" -ErrorAction SilentlyContinue
            if ($spawnLogs) {
              foreach ($log in $spawnLogs) {
                Write-Host "--- wmi spawn log ($($log.FullName)) ---"
                Get-Content $log.FullName -Tail 100
              }
            } else {
              Write-Host "No uninstall wmi spawn log files found under $tempDir"
            }
          }

          Write-Host "--- cleaning fixtures ---"
          Remove-Item -Path "${{ runner.temp }}\forge614-engram-uninstall-home" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "${{ runner.temp }}\forge614-engram-uninstall-temp" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "${{ runner.temp }}\forge614-engram-test-userpath" -Recurse -Force -ErrorAction SilentlyContinue
  unix:
    name: Unix checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install PostgreSQL binaries for the disposable test fixture
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql
            echo "FORGE614_TEST_POSTGRES_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
          else
            brew install postgresql@18
            echo "FORGE614_TEST_POSTGRES_BIN=$(brew --prefix postgresql@18)/bin" >> "$GITHUB_ENV"
          fi
      - run: bun test
      - run: bun run typecheck
      - run: git diff --check
      - name: Run native Bash installer fixtures
        run: bun test scripts/__tests__/install.sh.test.ts
      - run: bash -n scripts/install.sh scripts/install-from-source.sh
