name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  unix:
    name: Unix checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install PostgreSQL binaries for the disposable test fixture
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql
            echo "FORGE614_TEST_POSTGRES_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
          else
            brew install postgresql@17
            echo "FORGE614_TEST_POSTGRES_BIN=$(brew --prefix postgresql@17)/bin" >> "$GITHUB_ENV"
          fi
      - run: bun test
      - run: bun run typecheck
      - run: git diff --check
      - name: Run native Bash installer fixtures
        run: bun test scripts/__tests__/install.sh.test.ts
      - run: bash -n scripts/install.sh scripts/install-from-source.sh

  windows:
    name: Windows x64 native guard and installer fixtures
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          architecture: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: git diff --check
      - name: Build Windows x64 reparse addon with Visual Studio 2026
        shell: pwsh
        run: ./scripts/build-windows-reparse-addon.ps1 -Architecture x64
      - name: Verify guarded publication and reparse rejection on native Windows
        run: bun test src/infrastructure/filesystem/windows-reparse-guard.test.ts src/infrastructure/filesystem/private-files.test.ts src/infrastructure/assistants/windows-publication.test.ts scripts/__tests__/release-windows-native-addon.test.ts
      - run: pwsh -NoProfile -File scripts/__tests__/install.ps1.test.ps1
