name: verify-platforms
on:
  pull_request:
  push: { branches: [main] }
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with: { bun-version: "1.4.2" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22.19.0" }
      - name: Create isolated test homes on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          forge_home="$RUNNER_TEMP/forge614-home"
          forge614_home="$forge_home/.forge614"
          mkdir -p "$forge_home" "$forge614_home"
          printf 'HOME=%s\nFORGE614_HOME=%s\n' "$forge_home" "$forge614_home" >> "$GITHUB_ENV"
      - name: Create isolated test homes on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $forgeHome = Join-Path $env:RUNNER_TEMP "forge614-home"
          $forge614Home = Join-Path $forgeHome ".forge614"
          New-Item -ItemType Directory -Force -Path $forgeHome, $forge614Home | Out-Null
          "HOME=$forgeHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FORGE614_HOME=$forge614Home" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: bun install --frozen-lockfile
      - name: Cache real installer release assets for local end-to-end tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then target=windows-x64
          elif [[ "$RUNNER_OS" == "macOS" ]]; then target=darwin-$(uname -m | sed 's/arm64/arm64/;s/x86_64/x64/')
          else target=linux-$(uname -m | sed 's/aarch64/arm64/;s/x86_64/x64/'); fi
          asset_dir="$RUNNER_TEMP/forge614-installer-assets"
          mkdir -p "$asset_dir/shell" "$asset_dir/engines" "$asset_dir/legacy" "$asset_dir/workers" "$asset_dir/atlas"
          gh release download v1.17.0 -R jotredev/forge614-shell -D "$asset_dir/shell" -p forge614-shell-1.17.0.tar.gz -p forge614-shell-1.17.0.tar.gz.sha256 -p install.mjs -p install.sh -p install.ps1 -p forge614.node.json -p SHA256SUMS
          gh release download v1.18.0 -R jotredev/forge614-engines -D "$asset_dir/engines" -p "forge614-engines-1.18.0-$target.tar.gz" -p "forge614-engines-1.18.0-$target.tar.gz.sha256" -p install.mjs -p install.sh -p install.ps1 -p forge614.node.json -p SHA256SUMS
          legacy_binary="forge614-engram-$target"
          if [[ "$RUNNER_OS" == "Windows" ]]; then legacy_binary="$legacy_binary.exe"; fi
          gh release download v1.9.0 -R jotredev/forge614-engram -D "$asset_dir/legacy" -p "$legacy_binary" -p SHA256SUMS
          worker_binary="forge614-workers-$target"
          if [[ "$RUNNER_OS" == "Windows" ]]; then worker_binary="$worker_binary.exe"; fi
          gh release download v1.1.0 -R jotredev/forge614-workers -D "$asset_dir/workers" -p "$worker_binary" -p install.mjs -p install.sh -p forge614.node.json -p SHA256SUMS
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            atlas_binary="forge614-atlas-$target"
            gh release download v1.1.1 -R jotredev/forge614-atlas -D "$asset_dir/atlas" -p "$atlas_binary" -p install.sh -p SHA256SUMS
          fi
          echo "FORGE614_INSTALLER_E2E_ASSET_DIR=$asset_dir" >> "$GITHUB_ENV"
      - run: bun run verify
  build-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: windows-2025, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with: { bun-version: "1.4.2" }
      - run: bun install --frozen-lockfile
      - run: bun run build:target
        env: { FORGE614_TARGET: "${{ matrix.target }}" }
      - run: bun run smoke:target
        env: { FORGE614_TARGET: "${{ matrix.target }}" }
  windows-deferred-removal:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Verify removal can be scheduled through WMI
        shell: pwsh
        run: pwsh -NoProfile -File tests/e2e/windows-deferred-removal.e2e.ps1
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: reviewdog/action-actionlint@v1
