name: Release standalone artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Release verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install PostgreSQL binaries for the disposable test fixture
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          echo "FORGE614_TEST_POSTGRES_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - run: bun test
      - run: bun run typecheck
      - run: git diff --check
      - run: bun test scripts/__tests__/install.sh.test.ts
      - run: bash -n scripts/install.sh scripts/install-from-source.sh

  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: bun-darwin-arm64
            artifact: forge614-engram-darwin-arm64
            bun_version: 1.3.8
          - runner: macos-15-intel
            target: bun-darwin-x64
            artifact: forge614-engram-darwin-x64
            bun_version: 1.3.8
          - runner: ubuntu-latest
            target: bun-linux-x64
            artifact: forge614-engram-linux-x64
            bun_version: 1.3.8
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: forge614-engram-linux-arm64
            bun_version: 1.3.8
          - runner: windows-latest
            target: bun-windows-x64
            artifact: forge614-engram-windows-x64.exe
            bun_version: 1.3.8
            addon_architecture: x64
          # Bun 1.3.10 is the first release with a native Windows ARM64 runtime.
          # Keep this exception limited to the target Bun 1.3.8 cannot produce.
          - runner: windows-11-arm
            target: bun-windows-arm64
            artifact: forge614-engram-windows-arm64.exe
            bun_version: 1.3.10
            addon_architecture: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun_version }}
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 22.14.0
          architecture: ${{ matrix.addon_architecture }}
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build Windows reparse addon
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows-reparse-addon.ps1 -Architecture ${{ matrix.addon_architecture }}
      - name: Create the disposable build directory
        run: mkdir dist
      - name: Compile standalone artifact
        run: bun build ./src/cli.ts --compile --target=${{ matrix.target }} --outfile dist/${{ matrix.artifact }}
      - name: Smoke-test the native standalone artifact
        if: runner.os != 'Windows'
        shell: bash
        run: ./dist/${{ matrix.artifact }} --help
      - name: Smoke-test the native standalone artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP ("forge614-release-" + [Guid]::NewGuid().ToString('N'))
          try {
            New-Item -ItemType Directory -Path $profile -Force | Out-Null
            $env:HOME = $profile
            $env:USERPROFILE = $profile
            $env:LOCALAPPDATA = Join-Path $profile 'AppData\\Local'
            $env:APPDATA = Join-Path $profile 'AppData\\Roaming'
            $env:CLAUDE_CONFIG_DIR = Join-Path $profile '.claude'
            $env:CODEX_HOME = Join-Path $profile '.codex'
            $env:XDG_CONFIG_HOME = Join-Path $profile '.config'
            $env:OPENCODE_CONFIG_DIR = Join-Path $profile '.config\\opencode'
            $env:GEMINI_CLI_HOME = $profile
            $assistants = & .\\dist\\${{ matrix.artifact }} assistant-list | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'The packaged executable could not inspect assistant configuration paths.' }
            foreach ($id in @('claude-code', 'codex', 'cursor', 'opencode', 'antigravity')) {
              if ($id -notin @($assistants.id)) { throw "The packaged executable did not report $id." }
              $assistant = @($assistants | Where-Object { $_.id -eq $id })
              if ($assistant.Count -ne 1 -or $assistant[0].configuration.status -ne 'absent') {
                throw "The packaged executable could not safely inspect $id in the empty profile."
              }
            }
            if (Test-Path -LiteralPath (Join-Path $profile '.forge614')) { throw 'assistant-list created user storage.' }
          } finally {
            Remove-Item -LiteralPath $profile -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Preserve the artifact mode for collection
        run: tar -C dist -czf dist/${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  assemble:
    name: Assemble and validate release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Extract the six standalone artifacts with their original modes
        shell: bash
        run: |
          set -euo pipefail
          for archive in dist/*.tar.gz; do
            tar -xzf "$archive" -C dist
          done
      - name: Generate SHA256SUMS for the six release artifacts
        shell: bash
        run: |
          cd dist
          sha256sum \
            forge614-engram-darwin-arm64 \
            forge614-engram-darwin-x64 \
            forge614-engram-linux-x64 \
            forge614-engram-linux-arm64 \
            forge614-engram-windows-x64.exe \
            forge614-engram-windows-arm64.exe > SHA256SUMS
      - name: Validate release artifacts and manifest
        shell: bash
        run: |
          set -euo pipefail
          for artifact in forge614-engram-darwin-arm64 forge614-engram-darwin-x64 \
            forge614-engram-linux-x64 forge614-engram-linux-arm64 \
            forge614-engram-windows-x64.exe forge614-engram-windows-arm64.exe; do
            test -s "dist/$artifact" || { echo "missing or empty artifact: $artifact" >&2; exit 1; }
          done
          for artifact in forge614-engram-darwin-arm64 forge614-engram-darwin-x64 \
            forge614-engram-linux-x64 forge614-engram-linux-arm64; do
            test -x "dist/$artifact" || { echo "artifact is not executable: $artifact" >&2; exit 1; }
          done
          test -s dist/SHA256SUMS || { echo "missing or empty SHA256SUMS" >&2; exit 1; }
          test "$(wc -l < dist/SHA256SUMS | tr -d ' ')" = 6
          for artifact in forge614-engram-darwin-arm64 forge614-engram-darwin-x64 \
            forge614-engram-linux-x64 forge614-engram-linux-arm64 \
            forge614-engram-windows-x64.exe forge614-engram-windows-arm64.exe; do
            grep -Eq "^[0-9a-f]{64}  ${artifact}$" dist/SHA256SUMS || { echo "invalid checksum entry: $artifact" >&2; exit 1; }
          done
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/forge614-engram-darwin-arm64
            dist/forge614-engram-darwin-x64
            dist/forge614-engram-linux-x64
            dist/forge614-engram-linux-arm64
            dist/forge614-engram-windows-x64.exe
            dist/forge614-engram-windows-arm64.exe
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify, assemble]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Create the GitHub Release with the validated files only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/forge614-engram-darwin-arm64 \
            dist/forge614-engram-darwin-x64 \
            dist/forge614-engram-linux-x64 \
            dist/forge614-engram-linux-arm64 \
            dist/forge614-engram-windows-x64.exe \
            dist/forge614-engram-windows-arm64.exe \
            dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${release_flags[@]}"
